<!-- โค้ดสำหรับฟอร์มเลือกวัน ห้อง และเวลา -->
<div class="form-group">
    <label for="bookingDate">เลือกวันที่ (ปฏิทิน):</label>
    <input type="date" id="bookingDate" onchange="updateAvailableTimes()" required>
</div>

<div class="form-group">
    <label for="roomSelect">เลือกห้อง:</label>
    <select id="roomSelect" onchange="updateAvailableTimes()" required>
        <option value="">-- กรุณาเลือกห้อง --</option>
        <option value="228">ห้องคอมพิวเตอร์ 228</option>
        <option value="232">ห้องคอมพิวเตอร์ 232</option>
        <option value="233">ห้องคอมพิวเตอร์ 233</option>
        <option value="237">ห้องคอมพิวเตอร์ 237</option>
        <option value="238">ห้องคอมพิวเตอร์ 238</option>
        <option value="king_room">ห้องศาสตร์พระราชา</option>
    </select>
</div>

<div class="form-group">
    <label for="timeSelect">เลือกเวลา (เฉพาะที่ว่าง):</label>
    <select id="timeSelect" required>
        <option value="">-- กรุณาเลือกวันและห้องก่อน --</option>
    </select>
</div>
